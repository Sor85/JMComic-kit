services:
  jmcomic:
    build: .
    container_name: jmcomic-kit
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "5000:5000"
    environment:
      WEB_SERVER_HOST: 0.0.0.0
      WEB_SERVER_PORT: 5000
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      UMASK: ${UMASK:-000}
    volumes:
      - ./data:/app/data
      - ./download:/app/download
      - ./export:/app/export
    restart: unless-stopped

